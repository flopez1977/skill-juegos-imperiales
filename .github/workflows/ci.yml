name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  sin-red:
    name: Sin llamadas de red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La promesa del README se comprueba, no se firma
        run: |
          if grep -rnE '\b(requests|urllib|httpx|socket|aiohttp)\b' scripts/; then
            echo "::error::Alguien metió una librería de red en scripts/. El README promete que no las hay."
            exit 1
          fi
          echo "Sin librerías de red en scripts/."

  semgrep:
    name: Análisis estático
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config=p/python --config=p/secrets --error --skip-unknown-extensions .
